  <!-- 外框徽章 -->
  <rect x="10" y="10" width="236" height="236" rx="46" fill="#ffffff" stroke="#0b2b49" stroke-width="12"/>

  <!-- 串口监视器屏幕 -->
  <rect x="54" y="42" width="148" height="82" rx="12" fill="none" stroke="#0f6fbe" stroke-width="10"/>

